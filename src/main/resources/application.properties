# Application
spring.application.name=kammobackend
spring.config.import=optional:file:.env[.properties]
server.port=8080
server.address=0.0.0.0

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kammo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}

# Admin bootstrap
# app.admin.phone-number=
# Setting this promotes that already-registered account to admin on next restart.

# Logging
logging.level.org.springframework.security=INFO
