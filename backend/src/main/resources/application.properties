# Application
spring.application.name=kammobackend
spring.config.import=optional:file:.env[.properties]
server.port=8080
server.address=0.0.0.0

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kammo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}

# Admin bootstrap
# app.admin.phone-number=
# Setting this promotes that already-registered account to admin on next restart.

# Payments
# Switch to "paystack" once PAYSTACK_SECRET_KEY is set to go live with real charges/payouts/refunds.
app.payment.provider=${PAYMENT_PROVIDER:mock}
app.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}

# PUDO delivery provider (locker network) - AP (access point) account credentials
app.pudo.account-number=${PUDO_ACCOUNT_NUMBER:}
app.pudo.api-key=${PUDO_API_KEY:}

# Kammo-owned OTP/OTT payment verification (signs the one-time checkout reference)
app.payment.ott-secret=${PAYMENT_OTT_SECRET:change-this-development-secret-to-at-least-32-characters}

# Cloudflare Worker: payment-confirmed -> seller email trigger (workers/payment-notify)
app.worker.payment-notify-url=${WORKER_PAYMENT_NOTIFY_URL:http://localhost:8787}
app.worker.shared-secret=${WORKER_SHARED_SECRET:change-this-development-secret}

# Deal status-change notifications (email + WhatsApp), see DealStatusChangedListener
app.mail.from=${MAIL_FROM:noreply@kammo.co.za}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp Business Cloud API - disabled until a WhatsApp Business account and approved
# templates (see DealNotificationMatrix) are provisioned.
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com/v20.0}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# Logging
logging.level.org.springframework.security=INFO
